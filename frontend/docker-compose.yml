services:
  expo-dev:
    build: .
    container_name: eva-expo-dev
    network_mode: host      # Use host network so QR code shows local IP
    volumes:
      - .:/app              # Mount source code for live reload
      - /app/node_modules   # Anonymous volume to prevent overriding host's node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    stdin_open: true
    tty: true
