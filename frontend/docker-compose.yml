version: '3.8'

services:
  expo-dev:
    build: .
    container_name: eva-expo-dev
    ports:
      - "8081:8081"  # Expo dev server
    volumes:
      - .:/app              # Mount source code for live reload
      - /app/node_modules   # Anonymous volume to prevent overriding host's node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    stdin_open: true
    tty: true
